  <!-- frame -->
  <rect width="160" height="160" rx="18" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="157" height="157" rx="16.5" fill="none" stroke="url(#rim)" stroke-width="2" opacity="0.5"/>

