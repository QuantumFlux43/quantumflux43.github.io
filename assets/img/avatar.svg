<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="quantumflux43 avatar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1c17"/>
      <stop offset="1" stop-color="#0a1310"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ee87f"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="117" height="117" rx="22.5" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.55"/>
  <!-- subtle grid dots -->
  <g fill="#3ee87f" opacity="0.10">
    <circle cx="24" cy="24" r="1.4"/><circle cx="48" cy="24" r="1.4"/><circle cx="72" cy="24" r="1.4"/><circle cx="96" cy="24" r="1.4"/>
    <circle cx="24" cy="96" r="1.4"/><circle cx="48" cy="96" r="1.4"/><circle cx="72" cy="96" r="1.4"/><circle cx="96" cy="96" r="1.4"/>
  </g>
  <!-- monogram qf as terminal glyphs -->
  <g font-family="'JetBrains Mono','Fira Code',monospace" font-weight="700">
    <text x="60" y="70" text-anchor="middle" font-size="46" fill="url(#g)" letter-spacing="-2">qf</text>
    <!-- prompt caret + cursor -->
    <text x="26" y="98" font-size="15" fill="#5f8570">&gt;_</text>
    <rect x="86" y="86" width="9" height="15" fill="#3ee87f">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
