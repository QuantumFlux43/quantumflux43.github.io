# ============================================================
#  Site config. Ubah nilai di bawah sesuai kebutuhan.
# ============================================================

title: "quantumflux43"
tagline: "root@crypto:~# breaking ciphers for fun"
description: >-
  Catatan kripto: progress CryptoHack, arsip writeup CTF per tahun,
  dan dump ilmu soal RSA, AES, ECC, hash, PRNG, sampai lattice.

url: "https://quantumflux43.github.io"
baseurl: ""

lang: id
timezone: Asia/Jakarta

author:
  name: quantumflux43
  github: quantumflux43

# Kategori kripto (dipakai sidebar & halaman /categories/).
categories_order:
  - RSA
  - AES
  - ECC
  - Hash
  - PRNG
  - Lattice
  - Misc

# Tahun arsip CTF. Tambah tahun baru di paling atas.
ctf_years:
  - 2026

# Progress CryptoHack. Update angka kalau naik.
cryptohack:
  username: quantumflux43
  points: 1337
  rank: 420
  solved: 84
  categories:
    - { name: "Introduction",   solved: 9,  total: 9 }
    - { name: "General",        solved: 18, total: 22 }
    - { name: "Mathematics",    solved: 12, total: 20 }
    - { name: "Symmetric",      solved: 14, total: 24 }
    - { name: "RSA",            solved: 16, total: 28 }
    - { name: "Diffie-Hellman", solved: 8,  total: 14 }
    - { name: "Elliptic Curves", solved: 5, total: 16 }
    - { name: "Hash Functions", solved: 2,  total: 8 }

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true

permalink: /posts/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      math: true
      toc: true
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# Hanya plugin whitelist GitHub Pages supaya build otomatis jalan.
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - BACA-DULU.md
  - vendor
  - node_modules
