# ============================================================
#  Konfigurasi utama. Ganti nilai di bawah sesuai akun kamu.
# ============================================================

title: "dar"
tagline: "root@ctf:~$ crypto writeups"
description: >-
  Catatan dan writeup soal kriptografi dari berbagai CTF —
  RSA, AES, ECC, hash, dan PRNG.

url: "https://USERNAME.github.io"
baseurl: ""

lang: id
timezone: Asia/Jakarta

author:
  name: dar
  github: USERNAME

# Kategori resmi (dipakai sidebar & halaman /categories/).
# Urutan di sini menentukan urutan tampil di sidebar.
categories_order:
  - RSA
  - AES
  - ECC
  - Hash
  - PRNG
  - Lattice
  - Misc

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true

permalink: /posts/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      math: true
      toc: true
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# Hanya plugin yang di-whitelist GitHub Pages — supaya build otomatis
# (tanpa custom Actions workflow) tetap jalan.
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
