# ============================================================
#  Site config. Ubah nilai di bawah sesuai kebutuhan.
# ============================================================

title: "quantumflux43"
tagline: "root@crypto:~# breaking ciphers for fun"
description: >-
  Catatan kripto: Arsip CryptoHack, arsip writeup CTF per tahun,
  dan dump ilmu soal Cryptography.

url: "https://quantumflux43.github.io"
baseurl: ""

lang: id
timezone: Asia/Jakarta

author:
  name: quantumflux43
  github: quantumflux43

# Kategori kripto (dipakai buat tag writeup CTF).
categories_order:
  - RSA
  - AES
  - ECC
  - Hash
  - PRNG
  - Lattice
  - Misc

# Tahun arsip CTF. Tambah tahun baru di paling atas.
ctf_years:
  - 2026

# Kategori Crypto Knowledge. Tiap kategori punya halaman sendiri /knowledge/<slug>/.
# Artikel = post dengan front matter: platform: knowledge, kn_cat: <slug>
knowledge_cats:
  - { name: "RSA",     slug: "rsa",     desc: "Faktorisasi, exponent kecil, Coppersmith, oracle." }
  - { name: "AES",     slug: "aes",     desc: "Mode operasi, padding oracle, bit-flip, GCM." }
  - { name: "ECC",     slug: "ecc",     desc: "Serangan kurva, invalid curve, nonce bias." }
  - { name: "Hash",    slug: "hash",    desc: "Length extension, kolisi, MAC forgery." }
  - { name: "PRNG",    slug: "prng",    desc: "Mersenne Twister, LCG, prediksi state." }
  - { name: "Lattice", slug: "lattice", desc: "LLL, CVP, hidden number problem." }

# Progress CryptoHack. Total challenge sesuai kategori resmi cryptohack.org.
# Update angka "solved" kalau naik. slug dipakai buat filter writeup.
cryptohack:
  username: quantumflux43
  categories:
    - { name: "Introduction",       slug: "introduction",   solved: 0, total: 3 }
    - { name: "General",            slug: "general",        solved: 0, total: 19 }
    - { name: "Symmetric Ciphers",  slug: "symmetric",      solved: 0, total: 27 }
    - { name: "Mathematics",        slug: "mathematics",    solved: 0, total: 15 }
    - { name: "RSA",                slug: "rsa",            solved: 0, total: 29 }
    - { name: "Diffie-Hellman",     slug: "diffie-hellman", solved: 0, total: 14 }
    - { name: "Elliptic Curves",    slug: "elliptic-curves", solved: 0, total: 23 }
    - { name: "Hash Functions",     slug: "hash-functions", solved: 0, total: 14 }
    - { name: "Crypto on the Web",  slug: "crypto-web",     solved: 0, total: 17 }
    - { name: "Lattices",           slug: "lattices",       solved: 0, total: 18 }
    - { name: "Isogenies",          slug: "isogenies",      solved: 0, total: 23 }
    - { name: "Zero-Knowledge Proofs", slug: "zkp",         solved: 0, total: 17 }
    - { name: "Miscellaneous",      slug: "misc",           solved: 0, total: 14 }

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true

permalink: /posts/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      math: true
      toc: true
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# Hanya plugin whitelist GitHub Pages supaya build otomatis jalan.
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - BACA-DULU.md
  - vendor
  - node_modules
  - scripts
  - template
