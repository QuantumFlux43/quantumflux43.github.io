<aside class="sidebar">
  <a class="brand-card" href="{{ '/about/' | relative_url }}">
    <img class="brand-avatar" src="{{ '/assets/img/avatar.svg' | relative_url }}" alt="avatar {{ site.author.name }}" width="46" height="46">
    <div class="brand-meta">
      <div class="brand-name">{{ site.title }}</div>
      <div class="brand-role"><span class="lang-en">crypto :: ctf</span><span class="lang-id">kripto :: ctf</span></div>
    </div>
  </a>

  <div class="brand">
    <div class="prompt">{{ site.author.github }}@crypto:~#</div>
    <p class="tagline">{{ site.tagline }}</p>
  </div>

  <nav class="side-nav">
    <a href="{{ '/about/' | relative_url }}" class="nc-green {% if page.url contains '/about' %}active{% endif %}"><span class="pfx">&gt;</span> about</a>
    <a href="{{ '/' | relative_url }}" class="nc-cyan {% if page.url == '/' %}active{% endif %}"><span class="pfx">&gt;</span> home</a>
    <a href="{{ '/cryptohack/' | relative_url }}" class="nc-pink {% if page.url contains '/cryptohack' %}active{% endif %}"><span class="pfx">&gt;</span> cryptohack</a>
    <a href="{{ '/ctf/' | relative_url }}" class="nc-gold {% if page.url contains '/ctf' %}active{% endif %}"><span class="pfx">&gt;</span> ctf archives</a>
    <a href="{{ '/knowledge/' | relative_url }}" class="nc-purple {% if page.url contains '/knowledge' %}active{% endif %}"><span class="pfx">&gt;</span> knowledge</a>
  </nav>

  <div class="side-foot">
    (c) {{ site.time | date: '%Y' }} {{ site.author.name }}<br>
    {% if site.author.github %}<a href="https://github.com/{{ site.author.github }}">github.com/{{ site.author.github }}</a>{% endif %}
  </div>
</aside>
