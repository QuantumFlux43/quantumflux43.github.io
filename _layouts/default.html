<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
{% include head.html %}
<body>
<canvas id="matrix-bg" aria-hidden="true"></canvas>
<div class="mobile-bar">
  <button class="hamb" id="hamb" aria-label="menu" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a href="{{ '/' | relative_url }}" class="mb-title">{{ site.title }}</a>
  <div class="langtog" role="group" aria-label="language">
    <button data-lang="en" onclick="setLang('en')">EN</button>
    <button data-lang="id" onclick="setLang('id')">ID</button>
  </div>
  <button class="btn" onclick="toggleTheme()" aria-label="toggle theme">
    <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="15" height="15"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg>
  </button>
</div>
<div class="scrim" id="scrim"></div>
<div class="shell">
  {% include sidebar.html %}
  <main>
    <div class="topbar">
      <div class="langtog" role="group" aria-label="language">
        <button data-lang="en" onclick="setLang('en')">EN</button>
        <button data-lang="id" onclick="setLang('id')">ID</button>
      </div>
      <button class="btn" onclick="toggleTheme()" id="theme-btn" aria-label="toggle theme">
        <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="15" height="15"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg>
        <span class="lang-en">theme</span><span class="lang-id">tema</span>
      </button>
    </div>
    {{ content }}
    {% include footer.html %}
  </main>
</div>
<script>
function toggleTheme(){
  var r = document.documentElement;
  var cur = r.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  r.setAttribute('data-theme', cur);
  localStorage.setItem('theme', cur);
}
function setLang(l){
  document.documentElement.setAttribute('data-lang', l);
  localStorage.setItem('lang', l);
  syncLangBtn(l);
}
function syncLangBtn(l){
  var btns = document.querySelectorAll('.langtog button');
  for(var i=0;i<btns.length;i++){
    btns[i].classList.toggle('on', btns[i].getAttribute('data-lang') === l);
  }
}
syncLangBtn(document.documentElement.getAttribute('data-lang') || 'en');
(function(){
  var hamb = document.getElementById('hamb');
  var scrim = document.getElementById('scrim');
  var sb = document.querySelector('.sidebar');
  function open(){ document.body.classList.add('nav-open'); hamb.setAttribute('aria-expanded','true'); }
  function close(){ document.body.classList.remove('nav-open'); hamb.setAttribute('aria-expanded','false'); }
  function toggle(){ document.body.classList.contains('nav-open') ? close() : open(); }
  if(hamb) hamb.addEventListener('click', toggle);
  if(scrim) scrim.addEventListener('click', close);
  if(sb) sb.addEventListener('click', function(e){ if(e.target.closest('a')) close(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') close(); });
})();

// matrix rain background (subtle, hemat, hormat reduced-motion)
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce) return;
  var cv = document.getElementById('matrix-bg');
  if(!cv) return;
  var ctx = cv.getContext('2d', { alpha: true });
  var chars = '01<>[]{}/\\=+*#$abcdef0123456789ΣΔλφπΩ'.split('');
  var font = 14, cols = 0, drops = [], W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);

  function themeColor(){
    return document.documentElement.getAttribute('data-theme') === 'light'
      ? 'rgba(8,120,60,'    // hijau pekat buat light
      : 'rgba(80,255,150,'; // hijau terang buat dark
  }
  function resize(){
    W = cv.clientWidth = window.innerWidth;
    H = cv.clientHeight = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cols = Math.floor(W / font);
    drops = new Array(cols).fill(0).map(function(){ return Math.random() * -50; });
  }
  var last = 0;
  function draw(t){
    if(t - last > 48){                 // ~20fps, ringan
      last = t;
      var fade = document.documentElement.getAttribute('data-theme') === 'light'
        ? 'rgba(246,250,247,0.10)' : 'rgba(10,19,16,0.10)';
      ctx.fillStyle = fade;
      ctx.fillRect(0,0,W,H);
      ctx.font = font + "px 'JetBrains Mono', monospace";
      var col = themeColor();
      for(var i=0;i<drops.length;i++){
        var x = i*font, y = drops[i]*font;
        // kepala paling terang
        ctx.fillStyle = col + '1)';
        ctx.fillText(chars[(Math.random()*chars.length)|0], x, y);
        // ekor makin redup
        ctx.fillStyle = col + '0.55)';
        ctx.fillText(chars[(Math.random()*chars.length)|0], x, y - font);
        ctx.fillStyle = col + '0.22)';
        ctx.fillText(chars[(Math.random()*chars.length)|0], x, y - font*2);
        if(y > H && Math.random() > 0.965) drops[i] = Math.random() * -20;
        drops[i] += 0.62;
      }
    }
    requestAnimationFrame(draw);
  }
  resize();
  window.addEventListener('resize', function(){ clearTimeout(window.__mrz); window.__mrz = setTimeout(resize, 150); });
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
